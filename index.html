<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>锣鼓经排练版本台</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="app">
    <header class="top">
      <div>
        <p>Luogujing Version Console</p>
        <h1>锣鼓经排练版本台</h1>
      </div>
      <div class="transport">
        <button id="playBtn" type="button">播放</button>
        <button id="stopBtn" type="button" class="ghost">停止</button>
        <button id="lockBtn" type="button">锁定演出稿</button>
        <button id="trialBtn" type="button" class="ghost">新增试排</button>
        <button id="confirmBtn" type="button">确认试排</button>
        <button id="discardBtn" type="button" class="ghost">放弃试排</button>
      </div>
    </header>

    <div id="statusBanner" class="banner"></div>

    <section class="controls">
      <label>剧目<input id="pieceName" placeholder="如：出场锣鼓-慢起"></label>
      <label>板式
        <select id="banshiSelect">
          <option value="慢板">慢板</option>
          <option value="原板">原板</option>
          <option value="流水板">流水板</option>
          <option value="快板">快板</option>
          <option value="散板">散板</option>
        </select>
      </label>
      <label>速度BPM<input id="bpmInput" type="number" min="40" max="220" value="96"></label>
      <label>循环小节
        <select id="loopSelect">
          <option value="">全段</option>
          <option value="0">第1小节</option>
          <option value="1">第2小节</option>
          <option value="2">第3小节</option>
          <option value="3">第4小节</option>
        </select>
      </label>
      <label>难点批注<input id="noteInput" placeholder="如：第2小节小锣晚半拍"></label>
    </section>

    <section class="stage">
      <aside class="segments">
        <h2>已存方案（锁定稿）</h2>
        <div id="savedList"></div>
      </aside>
      <section class="score">
        <div id="grid" class="grid"></div>
      </section>
      <aside class="notes">
        <h2>段落结构</h2>
        <div id="structure"></div>
        <h2>批注</h2>
        <div id="notesList"></div>
        <h2>留档记录</h2>
        <div id="archiveList"></div>
      </aside>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
